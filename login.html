<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ಅಕ್ಷರ ದಾಸೋಹ ಕಾರ್ಯಕ್ರಮ - Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,"Noto Sans Kannada",sans-serif;background:linear-gradient(135deg,#eef4fb,#dcecff);color:#172033}
.login-box{width:100%;max-width:430px;margin:20px;background:#fff;padding:34px;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.14)}
.logo{text-align:center;font-size:48px;margin-bottom:8px}
h1{text-align:center;margin:0;color:#173b6c;font-size:27px}
.subtitle{text-align:center;margin:8px 0 28px;color:#64748b;font-size:15px}
label{display:block;font-weight:700;margin:15px 0 7px}
input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;outline:none}
input:focus{border-color:#1769aa;box-shadow:0 0 0 3px rgba(23,105,170,.10)}
.password-wrap{position:relative;width:100%}
.password-wrap input{padding-right:52px}
.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:6px 8px;font-size:20px;cursor:pointer}
.login-btn{width:100%;margin-top:24px;padding:14px;border:0;border-radius:9px;background:#1769aa;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.login-btn:disabled{opacity:.65;cursor:not-allowed}
.message{margin-top:16px;padding:12px;border-radius:8px;text-align:center;font-size:14px;display:none}
.error{display:block;background:#fdecec;color:#a61b1b}
.info{display:block;background:#eef6ff;color:#174a78}
.success{display:block;background:#e8f7ee;color:#126b36}
.footer{text-align:center;margin-top:22px;color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<div class="login-box">
<div class="logo">🍚</div>
<h1>ಅಕ್ಷರ ದಾಸೋಹ ಕಾರ್ಯಕ್ರಮ</h1>
<div class="subtitle">Username ಮತ್ತು Password ಮೂಲಕ Login</div>

<form id="loginForm">
<label for="username">Username</label>
<input id="username" type="text" placeholder="Username ನಮೂದಿಸಿ" autocomplete="username" required autofocus>

<label for="password">Password</label>
<div class="password-wrap">
<input id="password" type="password" placeholder="Password ನಮೂದಿಸಿ" autocomplete="current-password" required>
<button type="button" id="togglePassword" class="password-toggle">👁️</button>
</div>

<button id="loginBtn" class="login-btn" type="submit">LOGIN</button>
<div id="message" class="message"></div>
</form>

<div class="footer">ಅಕ್ಷರ ದಾಸೋಹ ಕಾರ್ಯಕ್ರಮ</div>
</div>

<script>
const SUPABASE_URL="https://ezmudfrpcvjsgnjibvoq.supabase.co";
const SUPABASE_KEY="sb_publishable__FYyH6NQaqgARaq2dvuovQ_rKmus0js";

let supabaseClient=null;

function showMessage(text,type="error"){
    const el=document.getElementById("message");
    el.textContent=text;
    el.className="message "+type;
}

document.getElementById("togglePassword").onclick=function(){
    const p=document.getElementById("password");
    if(p.type==="password"){
        p.type="text";
        this.textContent="🙈";
    }else{
        p.type="password";
        this.textContent="👁️";
    }
};

async function doLogin(e){
    if(e) e.preventDefault();

    const username=document.getElementById("username").value.trim().toUpperCase();
    const password=document.getElementById("password").value;
    const button=document.getElementById("loginBtn");

    if(!username || !password){
        showMessage("Username ಮತ್ತು Password ನಮೂದಿಸಿ.");
        return;
    }

    button.disabled=true;
    button.textContent="LOGIN ಆಗುತ್ತಿದೆ...";
    showMessage("Login ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ...","info");

    try{
        if(!window.supabase){
            throw new Error("Supabase library load ಆಗಿಲ್ಲ. Internet connection ಪರಿಶೀಲಿಸಿ.");
        }

        if(!supabaseClient){
            supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
        }

        // Existing Admin account.
        // School accounts use their DISE-code username as the login name.
        const authEmail = username==="ADMIN"
            ? "svbrhsbls@gmail.com"
            : username.toLowerCase()+"@login.aksharadasoha.local";

        const result=await supabaseClient.auth.signInWithPassword({
            email:authEmail,
            password:password
        });

        if(result.error){
            throw new Error(result.error.message || "Username ಅಥವಾ Password ತಪ್ಪಾಗಿದೆ.");
        }

        if(!result.data || !result.data.user){
            throw new Error("Login session ಸೃಷ್ಟಿಯಾಗಲಿಲ್ಲ.");
        }

        const userId=result.data.user.id;

        const access=await supabaseClient
            .from("school_users")
            .select("username,role,is_active,school_id")
            .eq("user_id",userId)
            .maybeSingle();

        if(access.error){
            await supabaseClient.auth.signOut();
            throw new Error("Account access ಪರಿಶೀಲನೆ ವಿಫಲವಾಗಿದೆ: "+access.error.message);
        }

        if(!access.data){
            await supabaseClient.auth.signOut();
            throw new Error("ಈ login accountಗೆ system access ನೀಡಲಾಗಿಲ್ಲ.");
        }

        if(!access.data.is_active){
            await supabaseClient.auth.signOut();
            throw new Error("ಈ account Active ಇಲ್ಲ.");
        }

        localStorage.setItem("akshara_username",access.data.username);
        localStorage.setItem("akshara_role",access.data.role);

        if(access.data.school_id){
            localStorage.setItem("akshara_school_id",access.data.school_id);
        }

        showMessage("Login ಯಶಸ್ವಿಯಾಗಿದೆ...","success");

        setTimeout(function(){
            if(access.data.role==="admin"){
                window.location.replace("admin.html");
            }else{
                window.location.replace("dashboard.html");
            }
        },300);

    }catch(err){
        console.error("LOGIN ERROR:",err);
        showMessage(err && err.message ? err.message : "Login failed.");
    }finally{
        button.disabled=false;
        button.textContent="LOGIN";
    }
}

document.getElementById("loginForm").addEventListener("submit",doLogin);
</script>
</body>
</html>
