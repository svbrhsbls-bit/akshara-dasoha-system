<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Password - Akshara Dasoha</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7fb;
      font-family: Arial, "Noto Sans Kannada", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
    }
    h2 { margin: 0 0 8px; text-align: center; }
    .sub { text-align: center; color: #666; margin-bottom: 24px; }
    label { display: block; margin: 14px 0 7px; font-weight: 600; }
    .passbox { position: relative; }
    input {
      width: 100%;
      padding: 12px 44px 12px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    .toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
    }
    button#updateBtn {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #166534;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button#updateBtn:disabled { opacity: .6; cursor: not-allowed; }
    #status {
      margin-top: 16px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }
    .error { display: block !important; background: #fee2e2; color: #991b1b; }
    .success { display: block !important; background: #dcfce7; color: #166534; }
  </style>
</head>
<body>

<div class="card">
  <h2>🔐 Password ಬದಲಾವಣೆ</h2>
  <div class="sub">ಹೊಸ Password ಅನ್ನು ನಮೂದಿಸಿ</div>

  <label for="password">ಹೊಸ Password</label>
  <div class="passbox">
    <input id="password" type="password" placeholder="ಕನಿಷ್ಠ 6 ಅಕ್ಷರಗಳು" autocomplete="new-password">
    <button class="toggle" type="button" onclick="togglePassword('password', this)">👁️</button>
  </div>

  <label for="confirmPassword">Password ಮತ್ತೆ ನಮೂದಿಸಿ</label>
  <div class="passbox">
    <input id="confirmPassword" type="password" placeholder="Password ದೃಢೀಕರಿಸಿ" autocomplete="new-password">
    <button class="toggle" type="button" onclick="togglePassword('confirmPassword', this)">👁️</button>
  </div>

  <button id="updateBtn" type="button">Password Update ಮಾಡಿ</button>
  <div id="status"></div>
</div>

<script>
const SUPABASE_URL = "https://ezmudfrpcvjsgnjibvoq.supabase.co";
const SUPABASE_KEY = "sb_publishable__FYyH6NQaqARaq2dvuovQ_rKmus0js";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function togglePassword(id, btn) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
  btn.textContent = input.type === "password" ? "👁️" : "🙈";
}

function showStatus(message, type) {
  const el = document.getElementById("status");
  el.textContent = message;
  el.className = type;
}

async function init() {
  // Supabase password recovery may establish the session asynchronously.
  const { data: { session } } = await supabaseClient.auth.getSession();

  if (!session) {
    showStatus(
      "Password reset link ಮಾನ್ಯವಾಗಿಲ್ಲ ಅಥವಾ ಈಗಾಗಲೇ ಬಳಸಲಾಗಿದೆ. Login page ನಿಂದ ಮತ್ತೆ Reset Password ಮಾಡಿ.",
      "error"
    );
    document.getElementById("updateBtn").disabled = true;
  }
}

supabaseClient.auth.onAuthStateChange(async (event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) {
    document.getElementById("updateBtn").disabled = false;
    showStatus("ಹೊಸ Password ನಮೂದಿಸಿ.", "success");
  }
});

document.getElementById("updateBtn").addEventListener("click", async () => {
  const password = document.getElementById("password").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();

  if (password.length < 6) {
    showStatus("Password ಕನಿಷ್ಠ 6 ಅಕ್ಷರಗಳಿರಬೇಕು.", "error");
    return;
  }

  if (password !== confirmPassword) {
    showStatus("ಎರಡು Password ಗಳು ಒಂದೇ ಆಗಿರಬೇಕು.", "error");
    return;
  }

  const btn = document.getElementById("updateBtn");
  btn.disabled = true;
  btn.textContent = "Updating...";

  const { error } = await supabaseClient.auth.updateUser({ password });

  if (error) {
    showStatus("Password update ವಿಫಲ: " + error.message, "error");
    btn.disabled = false;
    btn.textContent = "Password Update ಮಾಡಿ";
    return;
  }

  showStatus("Password ಯಶಸ್ವಿಯಾಗಿ ಬದಲಾಗಿದೆ. Login page ಗೆ ಹೋಗಲಾಗುತ್ತಿದೆ...", "success");

  await supabaseClient.auth.signOut();

  setTimeout(() => {
    window.location.href = "login.html";
  }, 1500);
});

init();
</script>

</body>
</html>
