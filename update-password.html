<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Update - Akshara Dasoha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f7fb;font-family:Arial,"Noto Sans Kannada",sans-serif}
.card{width:100%;max-width:430px;background:#fff;padding:30px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.10)}
h2{text-align:center;margin:0 0 8px}
.sub{text-align:center;color:#666;margin-bottom:24px}
label{display:block;margin:14px 0 7px;font-weight:600}
.passbox{position:relative}
input{width:100%;padding:12px 44px 12px 12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:18px}
#updateBtn{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#166534;color:#fff;font-size:16px;cursor:pointer}
#updateBtn:disabled{opacity:.6;cursor:not-allowed}
#status{margin-top:16px;padding:10px;border-radius:8px;display:none;line-height:1.5}
.error{display:block!important;background:#fee2e2;color:#991b1b}
.success{display:block!important;background:#dcfce7;color:#166534}
.info{display:block!important;background:#eef6ff;color:#174a78}
</style>
</head>
<body>
<div class="card">
<h2>🔐 Password ಬದಲಾವಣೆ</h2>
<div class="sub">ಹೊಸ Password ಅನ್ನು ನಮೂದಿಸಿ</div>

<label for="password">ಹೊಸ Password</label>
<div class="passbox">
<input id="password" type="password" placeholder="ಕನಿಷ್ಠ 6 ಅಕ್ಷರಗಳು" autocomplete="new-password">
<button class="toggle" type="button" onclick="togglePassword('password',this)">👁️</button>
</div>

<label for="confirmPassword">Password ಮತ್ತೆ ನಮೂದಿಸಿ</label>
<div class="passbox">
<input id="confirmPassword" type="password" placeholder="Password ದೃಢೀಕರಿಸಿ" autocomplete="new-password">
<button class="toggle" type="button" onclick="togglePassword('confirmPassword',this)">👁️</button>
</div>

<button id="updateBtn" type="button" disabled>Password Update ಮಾಡಿ</button>
<div id="status"></div>
</div>

<script>
const SUPABASE_URL="https://ezmudfrpcvjsgnjibvoq.supabase.co";
const SUPABASE_KEY="sb_publishable__FYyH6NQaqARaq2dvuovQ_rKmus0js";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function togglePassword(id,btn){
 const input=document.getElementById(id);
 input.type=input.type==="password"?"text":"password";
 btn.textContent=input.type==="password"?"👁️":"🙈";
}

function showStatus(text,type){
 const el=document.getElementById("status");
 el.textContent=text;
 el.className=type;
}

async function prepareRecoverySession(){
 try{
   showStatus("Password reset link ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ...","info");

   // Supabase email links may use PKCE (?code=...)
   const params=new URLSearchParams(window.location.search);
   const code=params.get("code");

   if(code){
     const {error}=await db.auth.exchangeCodeForSession(code);
     if(error) throw error;

     // Remove the one-time code from the browser URL.
     window.history.replaceState({},document.title,window.location.pathname);
   }

   // Older/hash-based recovery links are handled automatically by Supabase.
   const {data,error}=await db.auth.getSession();
   if(error) throw error;

   if(data.session){
     document.getElementById("updateBtn").disabled=false;
     showStatus("ಹೊಸ Password ನಮೂದಿಸಿ.","success");
     return;
   }

   showStatus("Password reset link ಮಾನ್ಯವಾಗಿಲ್ಲ ಅಥವಾ ಈಗಾಗಲೇ ಬಳಸಲಾಗಿದೆ. Login page ನಿಂದ ಮತ್ತೆ Reset Password ಮಾಡಿ.","error");
 }catch(err){
   console.error("PASSWORD RECOVERY ERROR:",err);
   showStatus("Reset link ಪರಿಶೀಲಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ: "+(err.message||"Unknown error"),"error");
 }
}

db.auth.onAuthStateChange((event,session)=>{
 if((event==="PASSWORD_RECOVERY" || event==="SIGNED_IN") && session){
   document.getElementById("updateBtn").disabled=false;
   showStatus("ಹೊಸ Password ನಮೂದಿಸಿ.","success");
 }
});

document.getElementById("updateBtn").addEventListener("click",async()=>{
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirmPassword").value;

 if(password.length<6){
   showStatus("Password ಕನಿಷ್ಠ 6 ಅಕ್ಷರಗಳಿರಬೇಕು.","error");
   return;
 }
 if(password!==confirm){
   showStatus("ಎರಡು Password ಗಳು ಒಂದೇ ಆಗಿರಬೇಕು.","error");
   return;
 }

 const btn=document.getElementById("updateBtn");
 btn.disabled=true;
 btn.textContent="Updating...";

 const {error}=await db.auth.updateUser({password});

 if(error){
   showStatus("Password update ವಿಫಲ: "+error.message,"error");
   btn.disabled=false;
   btn.textContent="Password Update ಮಾಡಿ";
   return;
 }

 showStatus("Password ಯಶಸ್ವಿಯಾಗಿ ಬದಲಾಗಿದೆ. Login page ಗೆ ಹೋಗಲಾಗುತ್ತಿದೆ...","success");
 await db.auth.signOut();

 setTimeout(()=>window.location.replace("login.html"),1500);
});

prepareRecoverySession();
</script>
</body>
</html>
