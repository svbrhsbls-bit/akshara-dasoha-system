function num(v){const x=Number(v);return Number.isFinite(x)?x:0} function fmt(v){return num(v).toFixed(3).replace(/\.000$/,'').replace(/(\.\d*?)0+$/,'$1')}

async function authenticate(){
 const {data:sessionData}=await db.auth.getSession(); if(!sessionData?.session){location.href='login.html';return false}
 const uid=sessionData.session.user.id;
 const {data:u,error}=await db.from('school_users').select('school_id,role,is_active').eq('user_id',uid).maybeSingle(); if(error)throw error;
 if(!u?.is_active)throw new Error('School login inactive.'); if(u.role==='admin'){location.href='admin.html';return false} state.schoolId=u.school_id; return true;

async function loadCalc(){state.calc={};const {data,error}=await db.from('calculation_settings').select('*').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId);if(error)throw error;(data||[]).forEach(r=>state.calc[r.class_group+'|'+r.item_name]=num(r.quantity_per_student));const {data:w,error:we}=await db.from('wheat_rate_settings').select('*').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId);if(!we)(w||[]).forEach(r=>state.calc[r.class_group+'|ಗೋಧಿ']=num(r.quantity_per_student))}
async function loadStudents(){state.students={};const {data,error}=await db.from('student_numbers').select('*').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId).eq('month_number',state.month).eq('division_name','ALL');if(error)throw error;(data||[]).forEach(r=>{const c=Number(r.class_number);const g=c===1?'1-5':c===6?'6-7':String(c);state.students[g]=num(r.total_students)});const saved=localStorage.getItem(`uc_fg_students|${state.schoolId}|${state.yearId}|${state.month}|${state.group}`);if(saved)try{const x=JSON.parse(saved);state.students=Object.assign(state.students,x)}catch(e){};document.querySelectorAll('[data-stu]').forEach(i=>{const [it,g]=i.dataset.stu.split('|');const v=it==='ಎಣ್ಣೆ / ಉಪ್ಪು'?(state.students[g]??''):(state.students[g]??'');i.value=v});calcTotals();setSectionLocked('students', !!saved)}

async function saveStudents(){state.yearId=$('academicYear').value;state.month=num($('month').value);state.group=$('classGroup').value;if(!state.yearId||!state.month){setMsg('Academic Year ಮತ್ತು Month ಕಡ್ಡಾಯ.');return}readInputs();try{localStorage.setItem(`uc_fg_students|${state.schoolId}|${state.yearId}|${state.month}|${state.group}`,JSON.stringify(state.students));setSectionLocked('students',true);setMsg('Students Numbers Save ಆಯಿತು.','ok');renderReport()}catch(e){console.error(e);setMsg('Students Numbers Save failed: '+(e.message||e))}}
async function saveOpening(){state.yearId=$('academicYear').value;state.month=num($('month').value);state.group=$('classGroup').value;if(!state.yearId||!state.month){setMsg('Academic Year ಮತ್ತು Month ಕಡ್ಡಾಯ.');return}readInputs();try{for(const it of items)for(const g of groups()){if(!applies(it,g))continue;const name=openName(it,g);const payload={school_id:state.schoolId,academic_year_id:state.yearId,item_type:'item',item_name:name,opening_balance:num(state.opening[key(it,g)]),unit:(it==='ಎಣ್ಣೆ'?'Gram':'KG'),updated_at:new Date().toISOString()};const {data:ex,error:ee}=await db.from('food_stock_opening_balances').select('id').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId).eq('item_name',name).maybeSingle();if(ee)throw ee;if(ex){const {error}=await db.from('food_stock_opening_balances').update(payload).eq('id',ex.id);if(error)throw error}else{const {error}=await db.from('food_stock_opening_balances').insert(payload);if(error)throw error}}setSectionLocked('opening',true);setMsg('Opening Balance Save ಆಯಿತು.','ok');renderReport()}catch(e){console.error(e);setMsg('Opening Balance Save failed: '+(e.message||e))}}
