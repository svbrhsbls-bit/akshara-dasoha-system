<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ಆಹಾರ ಧಾನ್ಯ ಬಳಕೆ ಪ್ರಮಾಣ ಪತ್ರ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
@page{size:A4 landscape;margin:5mm}
*{box-sizing:border-box}
body{margin:0;background:#eef2f5;color:#111;font-family:"Noto Sans Kannada","Nirmala UI","Tunga",Arial,sans-serif}
.app{max-width:1500px;margin:14px auto;padding:0 10px}
.controls{background:#fff;border:1px solid #ccc;border-radius:10px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:5px}
select,input{width:100%;padding:8px;border:1px solid #aaa;border-radius:6px;font:inherit}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.blue{background:#17569a;color:#fff}.green{background:#17733b;color:#fff}.gray{background:#555;color:#fff}.red{background:#b42318;color:#fff}
.msg{min-height:20px;margin-top:7px;font-weight:700}
.section-card{background:#fff;border:1px solid #ccc;border-radius:8px;padding:9px;margin-top:9px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title{font-size:16px;font-weight:800}.section-actions{display:flex;gap:7px}
.section-fields.locked{opacity:.72}
.section-fields.locked input,.section-fields.locked select{background:#f3f3f3;cursor:not-allowed}
.section-fields button:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:#555;margin-top:5px}
.input-table{width:100%;border-collapse:collapse;margin-top:7px}
.input-table th,.input-table td{border:1px solid #aaa;padding:5px;text-align:center}
.input-table input,.input-table select{padding:5px}
.report-wrap{background:#fff;padding:4mm;overflow:auto}
.report{width:100%;min-width:1250px;border-collapse:collapse;table-layout:fixed;font-size:12px}
.report th,.report td{border:1px solid #111;padding:3px;text-align:center;vertical-align:middle}
.nob{border:0!important}.logo{width:70px;height:auto}
.title{font-size:18px;font-weight:800}
.school{font-size:15px;font-weight:800;text-align:left!important}
.section{font-size:16px;font-weight:800;padding:7px!important}
.yellow{background:#fff500;font-weight:800}
.left{text-align:left!important}.small{font-size:10px}
.summary-label{font-weight:700;text-align:left!important}
.summary-value{font-weight:800}
.sign{height:58px;vertical-align:bottom!important;font-weight:800}
.report .num{font-variant-numeric:tabular-nums}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media print{
 body{background:#fff}.app{max-width:none;margin:0;padding:0}.controls{display:none!important}
 .report-wrap{padding:0;overflow:visible}.report{min-width:0;font-size:9px}
 .report th,.report td{padding:2px}.title{font-size:13px}.school{font-size:11px}
 .section{font-size:12px;padding:4px!important}.logo{width:58px}.small{font-size:8px}
}
</style>
</head>
<body>
<div class="app">
  <div class="controls">
    <div class="grid">
      <div>
        <label>ಶೈಕ್ಷಣಿಕ ವರ್ಷ</label>
        <div style="display:flex;gap:6px">
          <select id="academicYear" style="flex:1"><option value="">ಶೈಕ್ಷಣಿಕ ವರ್ಷ ಆಯ್ಕೆ ಮಾಡಿ</option></select>
          <button type="button" class="green" id="addYearBtn" style="white-space:nowrap;padding:8px 12px">＋ Year</button>
        </div>
        <div class="note">2026, 2027, 2028... ಬೇಕಾದ ವರ್ಷವನ್ನು ಇಲ್ಲಿ Add ಮಾಡಬಹುದು.</div>
      </div>
      <div><label>ತಿಂಗಳು</label><select id="month"><option value="">ತಿಂಗಳು ಆಯ್ಕೆ ಮಾಡಿ</option></select></div>
      <div><label>Class Group</label><select id="classGroup"><option value="1-7">1-7</option><option value="8-10">8-10</option></select></div>
    </div>
    <div class="actions">
      <button class="blue" id="loadBtn">↻ Load</button>
      <button class="gray" id="printBtn">🖨️ Print / PDF</button>
      <button class="green" id="excelBtn">📊 Excel Export</button>
    </div>
    <div class="msg" id="msg"></div>

    <div class="section-card">
      <div class="section-head"><div class="card-title">Students Numbers</div><div class="section-actions"><button class="green" id="saveStudentsBtn">💾 Save</button><button class="gray" id="editStudentsBtn">✏️ Edit</button></div></div>
      <div class="section-fields" id="studentsEntry"></div>
      <div class="note">UC Students Numbers ಪ್ರತ್ಯೇಕವಾಗಿ ನಮೂದಿಸಲಾಗುತ್ತದೆ. Daily Food Distribution ಅನ್ನು UC calculationಗೆ ಬಳಸುವುದಿಲ್ಲ.</div>
    </div>

    <div class="section-card">
      <div class="section-head"><div class="card-title">Opening Balance</div><div class="section-actions"><button class="green" id="saveOpeningBtn">💾 Save</button><button class="gray" id="editOpeningBtn">✏️ Edit</button></div></div>
      <div class="section-fields" id="openingEntry"></div>
    </div>

    <div class="section-card">
      <div class="section-head"><div class="card-title">UC Supply</div><div class="section-actions"><button class="green" id="saveSupplyBtn">💾 Save</button><button class="gray" id="editSupplyBtn">✏️ Edit</button></div></div>
      <div class="note">ಒಂದು ತಿಂಗಳಲ್ಲಿ ಹಲವು Supply entries ಹಾಕಬಹುದು. ದಿನಾಂಕವು ದಾಖಲಾತಿಗಾಗಿ ಮಾತ್ರ.</div>
      <div class="section-fields" id="supplyEntry"></div>
    </div>
  </div>
  <div class="report-wrap"><table class="report" id="reportTable"><tbody id="reportBody"></tbody></table></div>
</div>
<script>
const SUPABASE_URL='https://ezmudfrpcvjsgnjibvoq.supabase.co';
const SUPABASE_KEY='sb_publishable__FYyH6NQaqgARaq2dvuovQ_rKmus0js';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const EMBLEM='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
const months=['','ಜನವರಿ','ಫೆಬ್ರವರಿ','ಮಾರ್ಚ್','ಏಪ್ರಿಲ್','ಮೇ','ಜೂನ್','ಜುಲೈ','ಆಗಸ್ಟ್','ಸೆಪ್ಟೆಂಬರ್','ಅಕ್ಟೋಬರ್','ನವೆಂಬರ್','ಡಿಸೆಂಬರ್'];
const items=['ಅಕ್ಕಿ','ಗೋಧಿ','ಬೇಳೆ','ಎಣ್ಣೆ','ಉಪ್ಪು'];
const state={schoolId:null,schoolSettings:{},yearId:'',yearName:'',month:0,group:'1-7',students:{},opening:{},supplies:[],calc:{},schoolDays:0,schoolCounts:{8:0,9:0,10:0}};
const $=id=>document.getElementById(id);
function num(v){const x=Number(v);return Number.isFinite(x)?x:0}
function fmt(v){return num(v).toFixed(3).replace(/\.000$/,'').replace(/(\.\d*?)0+$/,'$1')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setMsg(t,ok=false){$('msg').textContent=t;$('msg').style.color=ok?'#17733b':'#b42318'}
function groups(){return state.group==='1-7'?['1-5','6-7']:['8','9-10']}
function applies(item,g){return !(state.group==='8-10'&&item==='ಗೋಧಿ'&&g!=='8')}
function key(item,g){return item+'|'+g}
function studentGroups(){return state.group==='1-7'?['1-5','6-7']:['8','9-10']}
function monthLabel(m,y){return `${months[m]||''}-${y||''}`}
function yearNumber(name){const m=String(name||'').match(/(\d{4})/);return m?Number(m[1]):new Date().getFullYear()}
function daysInMonth(year,month){return new Date(year,month,0).getDate()}
function prevMonthYear(month,year){if(month===1)return {month:12,year:year-1};return {month:month-1,year}}
function monthDateRange(year,month){const pad=n=>String(n).padStart(2,'0');return {start:`${year}-${pad(month)}-01`,end:`${year}-${pad(month)}-${pad(daysInMonth(year,month))}`}}

async function authenticate(){
 const {data,error}=await db.auth.getSession(); if(error)throw error;
 if(!data?.session){location.href='login.html';return false}
 const uid=data.session.user.id;
 const r=await db.from('school_users').select('school_id,role,is_active').eq('user_id',uid).maybeSingle();
 if(r.error)throw r.error;
 if(!r.data?.is_active)throw new Error('School login inactive.');
 if(r.data.role==='admin'){location.href='admin.html';return false}
 state.schoolId=r.data.school_id;return true;
}

async function loadSchool(){
 const {data,error}=await db.from('school_settings').select('*').eq('school_id',state.schoolId).maybeSingle();
 if(error)throw error;if(!data)throw new Error('School Settingsನಲ್ಲಿ ಶಾಲೆಯ ವಿವರಗಳು ಇಲ್ಲ.');
 state.schoolSettings=data;
}
async function loadYears(){
 const {data,error}=await db.from('academic_years').select('id,year_name,is_active').order('year_name',{ascending:false});
 if(error)throw error;
 $('academicYear').innerHTML='<option value="">ಶೈಕ್ಷಣಿಕ ವರ್ಷ ಆಯ್ಕೆ ಮಾಡಿ</option>'+(data||[]).map(y=>`<option value="${esc(y.id)}">${esc(y.year_name)}</option>`).join('');
 const wanted=String(state.schoolSettings.academic_year||'').trim();
 let active=(data||[]).find(y=>String(y.year_name||'').trim()===wanted)||(data||[]).find(y=>y.is_active)||(data||[])[0];
 if(active){$('academicYear').value=active.id;state.yearName=active.year_name||''}
}
async function addAcademicYear(){
 const raw=prompt('ಯಾವ Academic Year add ಮಾಡಬೇಕು? ಉದಾ: 2026 ಅಥವಾ 2026-27');
 const yearName=String(raw||'').trim();
 if(!yearName)return;
 if(!/^(\d{4})(?:[-\/](\d{2,4}))?$/.test(yearName)){
   setMsg('Year ಅನ್ನು 2026 ಅಥವಾ 2026-27 ರೀತಿಯಲ್ಲಿ ನಮೂದಿಸಿ.');
   return;
 }
 try{
   const {data:existing,error:ee}=await db.from('academic_years').select('id,year_name,is_active').eq('year_name',yearName).maybeSingle();
   if(ee)throw ee;
   if(existing){
     $('academicYear').value=existing.id;
     state.yearId=existing.id;state.yearName=existing.year_name||yearName;
     setMsg(yearName+' ಈಗಾಗಲೇ ಇದೆ. ಅದನ್ನೇ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.','ok');
     await loadAll();
     return;
   }
   const {data,error}=await db.from('academic_years').insert({year_name:yearName,is_active:false}).select('id,year_name,is_active').single();
   if(error)throw error;
   await loadYears();
   $('academicYear').value=data.id;
   state.yearId=data.id;state.yearName=data.year_name||yearName;
   setMsg(yearName+' Academic Year Add ಆಯಿತು.','ok');
 }catch(e){
   console.error(e);
   setMsg('Year Add failed: '+(e.message||e));
 }
}

function fillMonths(){$('month').innerHTML='<option value="">ತಿಂಗಳು ಆಯ್ಕೆ ಮಾಡಿ</option>'+months.slice(1).map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}

function sectionKey(name){return `uc_fg_${name}_locked|${state.schoolId}|${state.yearId}|${state.month}|${state.group}`}
function isSectionLocked(name){return !!state.schoolId&&!!state.yearId&&!!state.month&&localStorage.getItem(sectionKey(name))==='1'}
function applySectionLock(name,locked){
 const box=$(`${name}Entry`);if(!box)return;box.classList.toggle('locked',!!locked);
 box.querySelectorAll('input,select').forEach(x=>x.disabled=!!locked);
 if(name==='supply'){box.querySelectorAll('button').forEach(x=>x.disabled=!!locked);$('addSupplyBtn')?.toggleAttribute('disabled',!!locked)}
}
function setSectionLocked(name,locked){if(state.schoolId&&state.yearId&&state.month)localStorage.setItem(sectionKey(name),locked?'1':'0');applySectionLock(name,locked)}

function renderEntryTables(){
 const gs=groups();
 let s='<table class="input-table"><thead><tr><th>ಆಹಾರ ಪದಾರ್ಥ</th>'+gs.map(g=>`<th>${g}</th>`).join('')+'<th>ಒಟ್ಟು</th></tr></thead><tbody>';
 ['ಅಕ್ಕಿ','ಬೇಳೆ','ಗೋಧಿ','ಎಣ್ಣೆ / ಉಪ್ಪು'].forEach(it=>{const real=it==='ಎಣ್ಣೆ / ಉಪ್ಪು'?'ಎಣ್ಣೆ':it;s+=`<tr><th>${it}</th>`;gs.forEach(g=>s+=applies(real,g)?`<td><input type="number" min="0" step="1" data-stu="${key(it,g)}"></td>`:'<td>—</td>');s+='<td class="stut">0</td></tr>'});s+='</tbody></table>';$('studentsEntry').innerHTML=s;
 let o='<table class="input-table"><thead><tr><th>Opening Balance</th>'+gs.map(g=>`<th>${g}</th>`).join('')+'<th>ಒಟ್ಟು</th></tr></thead><tbody>';
 items.forEach(it=>{o+=`<tr><th>${it}</th>`;gs.forEach(g=>o+=applies(it,g)?`<td><input type="number" min="0" step="0.001" data-open="${key(it,g)}"></td>`:'<td>—</td>');o+='<td class="opent">0</td></tr>'});o+='</tbody></table>';$('openingEntry').innerHTML=o;
 let q='<table class="input-table"><thead><tr><th>ದಿನಾಂಕ</th><th>ಆಹಾರ ಪದಾರ್ಥ</th><th>ಪ್ರಕಾರ</th>'+gs.map(g=>`<th>${g}</th>`).join('')+'<th>ಒಟ್ಟು</th><th>Action</th></tr></thead><tbody id="supplyRows"></tbody></table><button type="button" class="gray" id="addSupplyBtn">＋ Supply Row</button>';$('supplyEntry').innerHTML=q;
 addSupplyRow();$('addSupplyBtn').addEventListener('click',()=>addSupplyRow());
 document.querySelectorAll('[data-stu],[data-open]').forEach(x=>x.addEventListener('input',()=>{calcTotals();renderReport()}));
 applySectionLock('students',isSectionLocked('students'));applySectionLock('opening',isSectionLocked('opening'));applySectionLock('supply',isSectionLocked('supply'));
}
function calcTotals(){
 $('studentsEntry').querySelectorAll('tbody tr').forEach(tr=>{let t=0;tr.querySelectorAll('[data-stu]').forEach(i=>t+=num(i.value));tr.querySelector('.stut').textContent=fmt(t)});
 $('openingEntry').querySelectorAll('tbody tr').forEach(tr=>{let t=0;tr.querySelectorAll('[data-open]').forEach(i=>t+=num(i.value));tr.querySelector('.opent').textContent=fmt(t)})
}
function addSupplyRow(date='',item='ಅಕ್ಕಿ',type='ಸರಬರಾಜು',vals={}){
 const gs=groups(),tr=document.createElement('tr');
 tr.innerHTML=`<td><input type="date" class="sd" value="${esc(date)}"></td><td><select class="si">${items.map(i=>`<option ${i===item?'selected':''}>${i}</option>`).join('')}</select></td><td><select class="stp"><option ${type==='ಖರೀದಿ'?'selected':''}>ಖರೀದಿ</option><option ${type==='ಸರಬರಾಜು'?'selected':''}>ಸರಬರಾಜು</option></select></td>`+gs.map(g=>`<td>${applies(item,g)?`<input type="number" min="0" step="0.001" class="sg-${g}" value="${num(vals[g])||''}">`:'—'}</td>`).join('')+'<td class="st">0</td><td><button type="button" class="red supply-remove">×</button></td>';
 $('supplyRows').appendChild(tr);tr.querySelector('.supply-remove').addEventListener('click',()=>{tr.remove();renderReport()});
 tr.querySelector('.si').addEventListener('change',()=>{rebuildSupplyRowForItem(tr);renderReport()});
 tr.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',renderReport));
 applySectionLock('supply',isSectionLocked('supply'));updateSupplyRowTotal(tr);
}
function rebuildSupplyRowForItem(tr){
 const item=tr.querySelector('.si').value,gs=groups();
 gs.forEach(g=>{const td=tr.querySelector('.sg-'+CSS.escape(g))?.parentElement;if(!td)return;if(applies(item,g)){if(!td.querySelector('input'))td.innerHTML=`<input type="number" min="0" step="0.001" class="sg-${g}">`}else td.textContent='—'});
 tr.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',renderReport));updateSupplyRowTotal(tr);
}
function updateSupplyRowTotal(tr){let t=0;groups().forEach(g=>t+=num(tr.querySelector('.sg-'+CSS.escape(g))?.value));const c=tr.querySelector('.st');if(c)c.textContent=fmt(t)}
function readInputs(){
 state.students={};document.querySelectorAll('[data-stu]').forEach(i=>{state.students[i.dataset.stu]=num(i.value)});
 state.opening={};document.querySelectorAll('[data-open]').forEach(i=>{state.opening[i.dataset.open]=num(i.value)});
 state.supplies=[...document.querySelectorAll('#supplyRows tr')].map(tr=>{const vals={};groups().forEach(g=>vals[g]=num(tr.querySelector('.sg-'+CSS.escape(g))?.value));return {date:tr.querySelector('.sd')?.value||'',item:tr.querySelector('.si')?.value||'',type:tr.querySelector('.stp')?.value||'ಸರಬರಾಜು',vals}}).filter(x=>x.date&&x.item);
}

function calcUse(it,g){
 const studentKey=(it==='ಎಣ್ಣೆ'||it==='ಉಪ್ಪು')?key('ಎಣ್ಣೆ / ಉಪ್ಪು',g):key(it,g);
 const rateKeyCandidates=[`${g}|${it}`,`${state.group}|${it}`,`${g==='9-10'?'9-10':g}|${it}`];
 let rate=0;for(const k of rateKeyCandidates){if(state.calc[k]!==undefined){rate=num(state.calc[k]);break}}
 return num(state.students[studentKey])*rate;
}
function supplyTotal(it,g,type){return state.supplies.filter(x=>x.item===it&&(type?x.type===type:true)).reduce((a,x)=>a+num(x.vals[g]),0)}
function currentOpening(it,g){return num(state.opening[key(it,g)])}

async function getClosingForMonth(month,year){
 if(!state.yearId||month<1)return {};
 const result={};
 const gs=groups();
 const prev=prevMonthYear(month,year);
 // previous month opening
 const names=[];for(const it of items)for(const g of gs)if(applies(it,g))names.push(`__UC_FG_OPENING__|${month}|${state.group}|${it}|${g}`);
 // Current month closing is based on current month opening, purchase/supply and UC students.
 // For the report's first row we query the previous month's saved opening and supply/student data.
 const op={};
 const q=await db.from('food_stock_opening_balances').select('item_name,opening_balance').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId).like('item_name','__UC_FG_OPENING__|%');
 if(q.error)throw q.error;(q.data||[]).forEach(r=>{const p=String(r.item_name).split('|');if(p[1]===String(prev.month)&&p[2]===state.group)op[key(p[3],p[4])]=num(r.opening_balance)});
 const rq=await db.from('food_stock_receipts').select('item_name,quantity,receipt_date').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId).like('item_name','__UC_FG_SUPPLY__|%');
 if(rq.error)throw rq.error;
 const supplies=[];(rq.data||[]).forEach(r=>{const p=String(r.item_name).split('|');if(p[1]===String(prev.month)&&p[2]===state.group)supplies.push({item:p[3],group:p[4],type:p[5]||'ಸರಬರಾಜು',qty:num(r.quantity)})});
 const saved=localStorage.getItem(`uc_fg_students|${state.schoolId}|${state.yearId}|${prev.month}|${state.group}`);let stu={};if(saved)try{stu=JSON.parse(saved)||{}}catch(e){}
 for(const it of items)for(const g of gs)if(applies(it,g)){
   const sk=(it==='ಎಣ್ಣೆ'||it==='ಉಪ್ಪು')?key('ಎಣ್ಣೆ / ಉಪ್ಪು',g):key(it,g);
   const rate=num(state.calc[`${g}|${it}`]??state.calc[`${state.group}|${it}`]??0);
   const use=num(stu[sk])*rate;
   const sup=supplies.filter(x=>x.item===it&&x.group===g).reduce((a,x)=>a+x.qty,0);
   result[key(it,g)]=num(op[key(it,g)])+sup-use;
 }
 return result;
}

async function getSchoolWorkingDays(){
 const y=yearNumber(state.yearName),m=state.month;if(!y||!m)return 0;
 const {start,end}=monthDateRange(y,m);const total=daysInMonth(y,m);
 const {data,error}=await db.from('school_holidays').select('holiday_date').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId).gte('holiday_date',start).lte('holiday_date',end);
 if(error)throw error;
 const unique=new Set((data||[]).map(r=>String(r.holiday_date).slice(0,10)));
 return Math.max(0,total-unique.size);
}

async function loadCalc(){
 state.calc={};
 const {data,error}=await db.from('calculation_settings').select('class_group,item_name,quantity_per_student,is_enabled').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId);
 if(error)throw error;(data||[]).forEach(r=>{if(r.is_enabled!==false)state.calc[`${String(r.class_group).trim()}|${String(r.item_name).trim()}`]=num(r.quantity_per_student)});
 const w=await db.from('wheat_rate_settings').select('*').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId);if(w.error)throw w.error;(w.data||[]).forEach(r=>{const g=String(r.class_group||'').trim();state.calc[`${g}|ಗೋಧಿ`]=num(r.quantity_per_student??r.rate??r.amount)});
}

async function loadStudentsSource(){
 state.schoolCounts={8:0,9:0,10:0};
 const {data,error}=await db.from('student_numbers').select('class_number,total_students').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId).eq('month_number',state.month).eq('division_name','ALL').in('class_number',[8,9,10]);
 if(error)throw error;(data||[]).forEach(r=>state.schoolCounts[Number(r.class_number)]=num(r.total_students));
}
async function loadStudentsUC(){
 state.students={};
 const saved=localStorage.getItem(`uc_fg_students|${state.schoolId}|${state.yearId}|${state.month}|${state.group}`);
 if(saved){try{state.students=JSON.parse(saved)||{}}catch(e){state.students={}}}
 document.querySelectorAll('[data-stu]').forEach(i=>{i.value=state.students[i.dataset.stu]??''});
 calcTotals();setSectionLocked('students',!!saved);
}
async function loadOpening(){
 state.opening={};
 const {data,error}=await db.from('food_stock_opening_balances').select('item_name,opening_balance').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId).like('item_name','__UC_FG_OPENING__|%');
 if(error)throw error;
 (data||[]).forEach(r=>{const p=String(r.item_name).split('|');if(p[1]===String(state.month)&&p[2]===state.group)state.opening[key(p[3],p[4])]=num(r.opening_balance)});
 let has=(data||[]).some(r=>{const p=String(r.item_name).split('|');return p[1]===String(state.month)&&p[2]===state.group});
 if(!has){
  try{
   const y=yearNumber(state.yearName),prevClosing=await getClosingForMonth(state.month,y);
   for(const it of items)for(const g of groups())if(applies(it,g))state.opening[key(it,g)]=num(prevClosing[key(it,g)]);
  }catch(e){console.warn('Previous closing default failed:',e.message)}
 }
 document.querySelectorAll('[data-open]').forEach(i=>{i.value=state.opening[i.dataset.open]??''});calcTotals();setSectionLocked('opening',has);
}
async function loadSupply(){
 const {data,error}=await db.from('food_stock_receipts').select('item_name,receipt_date,quantity').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId).like('item_name','__UC_FG_SUPPLY__|%').order('receipt_date',{ascending:true});
 if(error)throw error;
 const rows=(data||[]).map(r=>{const p=String(r.item_name).split('|');return {month:p[1],group:p[2],item:p[3],g:p[4],type:p[5]||'ಸರಬರಾಜು',date:p[6]||r.receipt_date,qty:num(r.quantity)}}).filter(x=>x.month===String(state.month)&&x.group===state.group);
 $('supplyRows').innerHTML='';
 if(!rows.length){addSupplyRow();setSectionLocked('supply',false);return}
 const grouped={};rows.forEach(r=>{const id=`${r.date}|${r.item}|${r.type}`;if(!grouped[id])grouped[id]={date:r.date,item:r.item,type:r.type,vals:{}};grouped[id].vals[r.g]=r.qty});
 Object.values(grouped).forEach(r=>addSupplyRow(r.date,r.item,r.type,r.vals));setSectionLocked('supply',true);renderReport();
}

async function loadAll(){
 state.yearId=$('academicYear').value;state.yearName=$('academicYear').selectedOptions[0]?.textContent||'';state.month=num($('month').value);state.group=$('classGroup').value;
 if(!state.yearId||!state.month){setMsg('Academic Year ಮತ್ತು Month ಕಡ್ಡಾಯ.');return}
 try{
  renderEntryTables();await loadCalc();await loadStudentsSource();await loadStudentsUC();await loadOpening();await loadSupply();state.schoolDays=await getSchoolWorkingDays();renderReport();setMsg('ಮಾಹಿತಿ Loaded.','ok');
 }catch(e){console.error(e);setMsg('Load failed: '+(e.message||e))}
}
function openName(it,g){return `__UC_FG_OPENING__|${state.month}|${state.group}|${it}|${g}`}

 state.yearId=$('academicYear').value;state.yearName=$('academicYear').selectedOptions[0]?.textContent||'';state.month=num($('month').value);state.group=$('classGroup').value;if(!state.yearId||!state.month){setMsg('Academic Year ಮತ್ತು Month ಕಡ್ಡಾಯ.');return}
 readInputs();try{localStorage.setItem(`uc_fg_students|${state.schoolId}|${state.yearId}|${state.month}|${state.group}`,JSON.stringify(state.students));setSectionLocked('students',true);setMsg('Students Numbers Save ಆಯಿತು.','ok');renderReport()}catch(e){console.error(e);setMsg('Students Numbers Save failed: '+(e.message||e))}
}
async function saveOpening(){
 state.yearId=$('academicYear').value;state.yearName=$('academicYear').selectedOptions[0]?.textContent||'';state.month=num($('month').value);state.group=$('classGroup').value;if(!state.yearId||!state.month){setMsg('Academic Year ಮತ್ತು Month ಕಡ್ಡಾಯ.');return}readInputs();
 try{for(const it of items)for(const g of groups()){if(!applies(it,g))continue;const name=openName(it,g);const payload={school_id:state.schoolId,academic_year_id:state.yearId,item_type:'item',item_name:name,opening_balance:num(state.opening[key(it,g)]),unit:it==='ಎಣ್ಣೆ'?'Gram':'KG',updated_at:new Date().toISOString()};const ex=await db.from('food_stock_opening_balances').select('id').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId).eq('item_name',name).maybeSingle();if(ex.error)throw ex.error;const r=ex.data?await db.from('food_stock_opening_balances').update(payload).eq('id',ex.data.id):await db.from('food_stock_opening_balances').insert(payload);if(r.error)throw r.error}setSectionLocked('opening',true);setMsg('Opening Balance Save ಆಯಿತು.','ok');renderReport()}catch(e){console.error(e);setMsg('Opening Balance Save failed: '+(e.message||e))}
}
async function saveSupply(){
 state.yearId=$('academicYear').value;state.yearName=$('academicYear').selectedOptions[0]?.textContent||'';state.month=num($('month').value);state.group=$('classGroup').value;if(!state.yearId||!state.month){setMsg('Academic Year ಮತ್ತು Month ಕಡ್ಡಾಯ.');return}readInputs();
 try{
  const old=await db.from('food_stock_receipts').select('id,item_name').eq('school_id',state.schoolId).eq('academic_year_id',state.yearId).like('item_name','__UC_FG_SUPPLY__|%');if(old.error)throw old.error;
  const del=(old.data||[]).filter(r=>{const p=String(r.item_name).split('|');return p[1]===String(state.month)&&p[2]===state.group}).map(r=>r.id);if(del.length){const d=await db.from('food_stock_receipts').delete().in('id',del);if(d.error)throw d.error}
  for(const s of state.supplies)for(const g of groups()){if(!applies(s.item,g))continue;const q=num(s.vals[g]);if(q<=0)continue;const name=`__UC_FG_SUPPLY__|${state.month}|${state.group}|${s.item}|${g}|${s.type}|${s.date}`;const payload={school_id:state.schoolId,academic_year_id:state.yearId,item_type:'item',item_name:name,receipt_date:s.date,quantity:q,unit:s.item==='ಎಣ್ಣೆ'?'Gram':'KG',updated_at:new Date().toISOString()};const r=await db.from('food_stock_receipts').insert(payload);if(r.error)throw r.error}
  setSectionLocked('supply',true);setMsg('UC Supply Save ಆಯಿತು.','ok');renderReport();
 }catch(e){console.error(e);setMsg('UC Supply Save failed: '+(e.message||e))}
}

async function renderReport(){

 h+=`<tr><td colspan="6" class="summary-label">ಫಲಾನುಭವಿಗಳ ಸಂಖ್ಯೆ: ${fmt(lowerTotal)}</td><td colspan="4" class="summary-label">ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳ ಸಂಖ್ಯೆ</td>${topVals.map(v=>`<td class="summary-value">${fmt(v)}</td>`).join('')}<td class="summary-value">${fmt(topTotal)}</td><td colspan="4">ತಿಂಗಳು / ${esc(curLabel)}</td></tr>`;
 const wheat8=state.group==='8-10'?num(state.students[key('ಗೋಧಿ','8')]):0; const wheatA=num(state.students[key('ಗೋಧಿ',gs[0])]); const wheatB=state.group==='8-10'?0:num(state.students[key('ಗೋಧಿ',gs[1])]); const wheatTotal=state.group==='8-10'?wheat8:wheatA+wheatB;
 h+=`<tr><td colspan="6" class="summary-label">ಶಾಲೆ ನಡೆದ ದಿನಗಳ ಸಂಖ್ಯೆ</td><td colspan="4" class="summary-value">${fmt(state.schoolDays)} ದಿನಗಳು</td><td colspan="2" class="summary-label">ಗೋಧಿ</td><td>${fmt(state.group==='8-10'?wheat8:wheatA)}</td><td>${state.group==='8-10'?'—':fmt(wheatB)}</td><td class="summary-value">${fmt(wheatTotal)}</td><td colspan="3"></td></tr>`;
 h+=`<tr><td colspan="18" class="section">: : ಆಹಾರ ಧಾನ್ಯ ಬಳಕೆ ಪ್ರಮಾಣ ಪತ್ರ : :</td></tr>`;
 h+=`<tr><th rowspan="2">ಕ್ರ ಸಂ</th><th rowspan="2">ವಿವರ</th><th rowspan="2">ದಿನಾಂಕ</th>`;
 const heads={'ಅಕ್ಕಿ':'ಅಕ್ಕಿ (0.150)','ಗೋಧಿ':'ಗೋಧಿ (0.150)','ಬೇಳೆ':'ಬೇಳೆ (0.030)','ಎಣ್ಣೆ':'ಎಣ್ಣೆ (7.5)','ಉಪ್ಪು':'ಉಪ್ಪು (0.004)'};items.forEach(it=>h+=`<th colspan="3">${heads[it]}</th>`);h+='</tr><tr>';items.forEach(()=>h+='<th>'+gs[0]+'</th><th>'+gs[1]+'</th><th>ಒಟ್ಟು</th>');h+='</tr>';
 const rows=[['ತಿಂಗಳ ಅಂತ್ಯಕ್ಕೆ ಉಳಿಕೆ','previous'],['ತಿಂಗಳ ಖರೀದಿ','purchase'],['ತಿಂಗಳ ಸರಬರಾಜು','supply'],['ಒಟ್ಟು ದಾಸ್ತಾನು','stock'],['ತಿಂಗಳ ಬಳಕೆ','use'],['ತಿಂಗಳ ಅಂತ್ಯಕ್ಕೆ ಉಳಿಕೆ','closing']];

 ['ದಾಖಲಾತಿ','ಹಾಜರಾತಿ','ಫಲಾನುಭವಿಗಳು'].forEach(label=>{h+=`<tr><th colspan="3" class="left">${label}</th>`;lower.forEach(v=>h+=`<td>${fmt(v)}</td>`);h+=`<td colspan="12"><strong>${fmt(lowerTotal)}</strong></td></tr>`});

 $('reportBody').innerHTML=h;document.querySelectorAll('#supplyRows tr').forEach(updateSupplyRowTotal);
}
